name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: buildozer/buildozer:latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build APK with Buildozer
        run: |
          cd /root/buildozer
          buildozer android debug
        working-directory: ${{ github.workspace }}
      
      - name: Upload APK to artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mission-panda-mandarin-apk
          path: bin/*.apk
          retention-days: 30
